<body>

                <input placeholder="ads" type="number" id="ads">
                <input placeholder="discount" type="number" id="discount">

            <input placeholder="count" type="number" id="count">
            <input placeholder="category" type="text" id="category">
            <button id="submit">Create</button>

            </form>
            <div class="outputs">

                        <button onclick="searchMood (this.id)" id="searchTitle">

                        <button onclick="searchMood (this.id)" id="searchCategory">

                <div id="deleteAll">

                </div>
                <table id="finl">

                        <th>price</th>

                    </tbody>

</html>
